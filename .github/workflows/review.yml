name: Claude review

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: false

jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      # gate in a step, not a job-level if, so the job passes and automerge still runs
      - id: gate
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          DRAFT: ${{ github.event.pull_request.draft }}
          ACTION: ${{ github.event.action }}
        run: |
          skip() { echo "::notice title=Claude review skipped::$1"; exit 0; }
          [[ $HAS_KEY == true ]] || skip "ANTHROPIC_API_KEY secret is not set"
          [[ $DRAFT == false ]] || skip "PR is a draft"
          [[ $ACTION != unlabeled ]] || skip "label change only; code already reviewed"
          echo run=true >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        # advisory only: an API hiccup shouldn't block the merge
        continue-on-error: true
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Focus on correctness bugs, security issues,
            and missing tests for changed behaviour. Skip style nits; ruff handles those.
            Use inline comments for specific issues. Finish with one short summary
            comment via `gh pr comment`. If nothing is worth flagging, say so briefly.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
